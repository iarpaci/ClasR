<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://clasr.ai/login/">
    <title>Log In | Clasr</title>
    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css?v=account-fixes-1">
    <script src="/script.js?v=account-fixes-1" defer></script>
  </head>
  <body class="auth-page">
    <a href="/" class="auth-back">← Back to home</a>
    <main class="auth-shell" aria-labelledby="login-title">
      <a href="/" aria-label="Clasr home"><img class="logo" src="/assets/brand/logo-primary.svg?v=clean-final-1" alt="Clasr"></a>
      <p id="login-title">Start mapping manuscripts in under a minute.</p>
      <form class="auth-card" action="/dashboard/" data-auth-form="login">
        <a class="button" href="#" data-auth-google>Continue with <strong>&nbsp;Google</strong></a>
        <div class="divider">OR</div>
        <label class="field">
          <span>Email:</span>
          <input type="email" name="email" placeholder="Enter your email" autocomplete="email" required>
        </label>
        <label class="field">
          <span>Password:</span>
          <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
        </label>
        <p class="auth-inline-link"><a href="/forgot-password/">Forgot password?</a></p>
        <button class="button button--primary auth-primary" type="submit">Log In</button>
      </form>
      <p class="auth-switch">Don&rsquo;t have an account? <a href="/register/">Create account</a></p>
    </main>

        <footer class="app-footer" aria-label="Workspace footer">
      <div class="app-footer__inner">
        <strong>Clasr is operated by Hilal Şençelik · © 2026</strong>
        <nav aria-label="Workspace footer links">
          <a href="/legal/">Clasr Legal</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
